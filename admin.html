<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYNN Fix</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:16px}.card{background:#1e293b;padding:16px;border-radius:14px;max-width:480px;margin:auto} input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff} button{padding:14px;border-radius:12px;border:none;font-weight:800;width:100%;margin-top:10px}.p{background:#7c3aed;color:#fff}.b{background:#2563eb;color:#fff}.log{background:#000;color:#0f0;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;margin-top:10px;max-height:200px;overflow:auto}</style>
</head><body>
<div class="card">
<h3>🔌 SYNNMLBB FIX 403/405</h3>
<input id="apiKey" value="q3EdSMpHrXGrd6qzp3kh">
<input id="endpoint" value="https://synnmlbb.com/api/v1/products">
<div style="display:flex;gap:8px">
<div style="flex:1"><label>PROFIT %</label><input id="profit" type="number" value="25"></div>
<div style="flex:1"><label>TYPE</label><select id="type"><option value="percent">% Persen</option><option value="rupiah">Rp</option></select></div>
</div>
<select id="gameTarget"><option>MLID</option><option selected>MLMY</option></select>
<button class="p" onclick="sync()">🔄 SYNC PRODUK SYNNMLBB</button>
<button class="b" onclick="save()">💾 SIMPAN</button>
<div id="log" class="log">Tekan SYNC dulu bos</div>
<div id="list" style="margin-top:12px"></div>
</div>
<script>
let all=[];
function log(m){document.getElementById('log').innerText+="\n"+m}
async function sync(){
 const key=document.getElementById('apiKey').value.trim();
 const ep=document.getElementById('endpoint').value.trim();
 document.getElementById('list').innerHTML="⏳ Sync...";
 document.getElementById('log').innerText="Mulai sync...\nEndpoint: "+ep;
 // kaedah yang betul untuk SYNN
 const tries=[
  {url:ep, opt:{method:'GET', headers:{'X-API-KEY':key,'api-key':key,'Authorization':'Bearer '+key}}},
  {url:ep, opt:{method:'POST', headers:{'Content-Type':'application/json','X-API-KEY':key}, body:JSON.stringify({api_key:key})}},
  {url:ep+"?api_key="+key, opt:{method:'GET'}},
  {url:"https://synnmlbb.com/api/products?api_key="+key, opt:{method:'GET'}}
 ];
 let data=null;
 for(let i=0;i<tries.length;i++){
  const t=tries[i];
  log("Coba method "+(i+1)+": "+t.opt.method+" "+t.url.slice(0,60));
  try{
    // guna cors proxy untuk bypass github pages block
    const proxy = "https://corsproxy.io/?"+encodeURIComponent(t.url);
    const res = await fetch(t.url, t.opt).catch(async ()=> await fetch(proxy, t.opt));
    log("Status: "+res.status);
    if(!res.ok){ log("❌ "+res.status+" "+res.statusText); continue; }
    const txt=await res.text();
    log("Response 200, panjang: "+txt.length);
    try{ data=JSON.parse(txt); break; }catch(e){ log("Bukan JSON: "+txt.slice(0,100)); }
  }catch(e){ log("❌ Error: "+e.message); }
 }
 if(!data){ document.getElementById('list').innerHTML="❌ GAGAL 403/405<br><br>1. Buka synnmlbb.com -> API Setting -> IP Whitelist pastikan = <b>0.0.0.0</b> DAN tekan Save<br>2. Tunggu 2 minit<br>3. Refresh page ni & SYNC balik"; return; }
 let prods=Array.isArray(data)?data:(data.data||data.products||[data]);
 all=prods;
 log("✅ Dapat "+prods.length+" produk");
 const list=document.getElementById('list'); list.innerHTML="";
 prods.forEach((p,i)=>{
  const name=p.product_name||p.name||p.title||"Diamond "+i;
  const base=parseFloat(p.price||p.base_price||0);
  const profit=parseFloat(document.getElementById('profit').value)||25;
  let sell= base + base*profit/100;
  const d=document.createElement('div');
  d.style="border:1px solid #334155;padding:8px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;background:#0f172a;font-size:13px";
  d.innerHTML=`<label><input type="checkbox" checked data-i="${i}"> ${name}</label><span style="color:#22c55e">RM ${sell.toFixed(2)}</span>`;
  list.appendChild(d);
 });
}
function save(){
 const target=document.getElementById('gameTarget').value;
 const cbs=document.querySelectorAll('#list input:checked');
 let out=[];
 cbs.forEach(cb=>{ const p=all[parseInt(cb.dataset.i)]; out.push(p); });
 localStorage.setItem("products_"+target, JSON.stringify(out));
 alert("✅ Simpan "+out.length+" ke "+target);
}
</script>
</body></html>
