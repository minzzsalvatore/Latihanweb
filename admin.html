<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN KHAI</title>
<style>body{background:#080c14;color:#fff;font-family:Poppins;padding:14px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #1a253e;background:#121a2b;color:#fff;margin:6px 0}button{width:100%;padding:12px;background:#1a5bff;color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:10px}.kad{background:#121a2b;padding:10px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between}</style>
</head><body>
<h2>POST PRODUK - KHAI STORE</h2>
<input id="nama" placeholder="Nama produk cth: 140 Diamonds">
<input id="hargaModal" type="number" step="0.01" placeholder="Harga modal dari provider cth: 10.42">
<input id="untung" type="number" step="0.01" value="2" placeholder="Untung RM">
<select id="kategori"><option value="topup">TOP UP</option><option value="weekly">WEEKLY / WDP</option><option value="first">FIRST RECHARGE</option></select>
<input id="code" placeholder="Code provider cth: ml_140">
<button onclick="add()">POST PRODUK</button>
<div id="list"></div>
<script>
function load(){let d=JSON.parse(localStorage.getItem('KHAI_PRODUK')||'[]');let h='';d.forEach((p,i)=>{h+=`<div class=kad><div><b>${p.nama}</b><br>Modal: ${p.modal} | Jual: RM${p.jual}<br>${p.kategori} | ${p.code}</div><button onclick="del(${i})" style="width:auto;background:red;padding:6px 10px">X</button></div>`});document.getElementById('list').innerHTML=h}
function add(){let nama=document.getElementById('nama').value;let modal=parseFloat(document.getElementById('hargaModal').value);let untung=parseFloat(document.getElementById('untung').value);let kat=document.getElementById('kategori').value;let code=document.getElementById('code').value;if(!nama||!modal)return alert('isi nama & modal');let jual=modal+untung;let d=JSON.parse(localStorage.getItem('KHAI_PRODUK')||'[]');d.push({nama,modal,jual,kategori:kat,code});localStorage.setItem('KHAI_PRODUK',JSON.stringify(d));load();alert('Dah POST! Buka mlmy.html tengok')}
function del(i){let d=JSON.parse(localStorage.getItem('KHAI_PRODUK')||'[]');d.splice(i,1);localStorage.setItem('KHAI_PRODUK',JSON.stringify(d));load()}
load();
</script></body></html>
