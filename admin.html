<script>
let RAW=[];
async function tarik(){
 document.getElementById('stat').innerText='Tarik...';
 try{
  let r=await fetch("https://corsproxy.io/?https://api.synnstore.com/api/product/list?game=mobile-legends",{headers:{"x-api-key":document.getElementById('key').value}});
  let j=await r.json(); RAW=j.data||j.products||j||[];

 }
