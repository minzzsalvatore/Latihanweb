<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN SYNN PROVIDER - KYYSHINN</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;font-family:'Poppins',sans-serif}body{background:#080c14;color:#fff;padding:14px;margin:0}.card{background:#121a2b;border:1px solid #1a253e;border-radius:16px;padding:16px;margin-bottom:12px}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #1a253e;background:#080c14;color:#fff;margin:6px 0;outline:none}button{width:100%;padding:13px;border-radius:10px;border:none;font-weight:800;cursor:pointer}.biru{background:#1a5bff;color:#fff}.hijau{background:#00e676;color:#000}.kuning{background:#ffca28;color:#000}.ungu{background:#8b5cf6;color:#fff}.item{background:#0f192b;border:1px solid #1a253e;border-radius:10px;padding:12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;font-size:11px}label{font-size:10px;color:#7a8599;font-weight:700}.flex{display:grid;grid-template-columns:1fr 1fr;gap:8px}.badge{font-size:10px;padding:3px 8px;border-radius:6px;background:#12295a;color:#3a7bff;border:1px solid #1a4fbf}.status{padding:10px;border-radius:10px;font-size:11px;margin:8px 0}.ok{background:#0a2a1a;color:#00e676;border:1px solid #00e676}.err{background:#2a0a0a;color:#ff4567;border:1px solid #ff4567}
</style>
</head><body>

<div class="card">
<h3 style="margin:0">🔌 SYNN PROVIDER SYNC - KYYSHINN STORE</h3>
<p style="font-size:11px;color:#7a8599">Auto sync produk dari Synn Store API + profit auto</p>

<label>🌐 SYNN API BASE URL</label>
<input id="apiBase" value="https://api.synn.store" placeholder="https://api.synn.store">
<label>🔑 API KEY SYNN</label>
<input id="apiKey" placeholder="sk_live_xxxx atau api key kau">
<label>🆔 GAME CODE DI SYNN (contoh: mlbb, freefire)</label>
<select id="synnGame">
<option value="mobile-legends">Mobile Legends (mobile-legends)</option>
<option value="mobile-legends-id">Mobile Legends ID (mobile-legends-id)</option>
<option value="free-fire">Free Fire</option>
<option value="pubg">PUBG Mobile</option>
<option value="genshin-impact">Genshin Impact</option>
<option value="valorant">Valorant</option>
</select>

<div class="flex" style="margin-top:8px">
<input id="profitSet" type="number" value="25" placeholder="Profit %">
<select id="profitType"><option value="percent">% Persen</option><option value="fixed">+ RM Fixed</option></select>
</div>

<div class="flex">
<button class="ungu" onclick="syncSynn()">🔄 SYNC DARI SYNN</button>
<button class="biru" onclick="saveConfig()">💾 SIMPAN CONFIG</button>
</div>

<div id="status"></div>
</div>

<div class="card">
<label>📦 HASIL SYNN (pilih yang mau dijual)</label>
<div id="synnList" style="max-height:300px;overflow:auto;border:1px solid #1a253e;border-radius:10px;padding:8px">Belum sync</div>
<div class="flex" style="margin-top:8px">
<button class="kuning" onclick="addSelected()">➕ ADD YANG DICENTANG + PROFIT</button>
<button class="hijau" onclick="addAllSynn()">⚡ ADD SEMUA + PROFIT</button>
</div>
</div>

<div class="card">
<label>PILIH GAME LOCAL (tempat simpan)</label>
<select id="localGame">
<option value="KYYSHINN_MLID">🇮🇩 MLID (mlid.html)</option>
<option value="KYYSHINN_MLMY">🇲🇾 MLMY (mlmy.html)</option>
<option value="KYYSHINN_FF">🔥 FREE FIRE</option>
<option value="KYYSHINN_PUBG">🎯 PUBG</option>
</select>

<label>🖼️ BANNER / ICON / LOGO (dari admin lama)</label>
<div class="flex"><input id="bannerUrl" placeholder="Banner URL"><input id="iconUrl" placeholder="Icon URL"></div>
<input id="logoUrl" placeholder="Logo URL">
<button class="biru" onclick="saveImages()">SIMPAN GAMBAR</button>
</div>

<div class="card"><b id="count">0 produk local</b> <span class="badge" id="cur">-</span>
