<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN KHAI</title>
<style>*{box-sizing:border-box;font-family:Poppins}body{background:#080c14;color:#fff;padding:14px}.card{background:#121a2b;border:1px solid #1a253e;border-radius:16px;padding:16px;margin-bottom:12px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #1a253e;background:#080c14;color:#fff;margin:6px 0}button{width:100%;padding:13px;border-radius:10px;border:none;font-weight:800} .biru{background:#1a5bff;color:#fff}.item{background:#0f192b;border:1px solid #1a253e;border-radius:10px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;font-size:11px}</style>
</head><body>
<div class="card">
<h3>POST PRODUK MLBB</h3>
<input id="nama" placeholder="Contoh: 140 Diamonds">
<select id="kat"><option value="topup">TOP UP</option><option value="weekly">WEEKLY PASS</option></select>
<input id="harga" type="number" step="0.01" placeholder="Harga Jual RM: 12.90">
<button class="biru" onclick="add()">POST</button>
<button onclick="location.href='mlmy.html'" style="margin-top:8px;background:#00e676">LIHAT WEB</button>
</div>
<div class="card"><b id="count">0 produk</b><div id="list"></div></div>
<script>
function load(){let d=JSON.parse(localStorage.getItem('KHAI_MLBB')||'[]');document.getElementById('count').innerText=d.length+' produk';let h='';d.forEach((p,i)=>{h+=`<div class=item><div><b>${p.n}</b><br>${p.kat}<br><span style=color:#00e676>RM${p.p.toFixed(2)}</span></div><button onclick="del(${i})" style="width:auto;background:red;color:#fff;padding:6px 10px;border-radius:8px;border:none">X</button></div>`});document.getElementById('list').innerHTML=h}
function add(){let n=document.getElementById('nama').value;let h=parseFloat(document.getElementById('harga').value);let kat=document.getElementById('kat').value;if(!n||!h)return alert('isi nama & harga');let d=JSON.parse(localStorage.getItem('KHAI_MLBB')||'[]');d.push({n:n,p:h,kat:kat});localStorage.setItem('KHAI_MLBB',JSON.stringify(d));document.getElementById('nama').value='';document.getElementById('harga').value='';load()}
function del(i){let d=JSON.parse(localStorage.getItem('KHAI_MLBB')||'[]');d.splice(i,1);localStorage.setItem('KHAI_MLBB',JSON.stringify(d));load()}
load();
</script></body></html>
