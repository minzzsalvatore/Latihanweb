<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYNN ADMIN FINAL</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:14px}.card{background:#1e293b;padding:16px;border-radius:14px;max-width:500px;margin:auto}input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}button{padding:14px;border-radius:12px;border:none;font-weight:800;width:100%;margin-top:10px}.p{background:#7c3aed;color:#fff}.b{background:#2563eb;color:#fff}.log{background:#000;color:#0f0;font-size:11px;padding:10px;border-radius:8px;white-space:pre-wrap;margin-top:10px;max-height:180px;overflow:auto}.item{border:1px solid #334155;padding:10px;border-radius:10px;margin-bottom:8px;background:#0f172a;display:flex;justify-content:space-between;font-size:13px}</style>
</head><body>
<div class="card">
<h3>🔌 SYNNMLBB - FINAL FIX</h3>
<input id="apiKey" value="q3EdSMpHrXGrd6qzp3kh">
<input id="endpoint" value="https://synnmlbb.com/api/products">
<div style="display:flex;gap:8px"><div style="flex:1"><label>PROFIT %</label><input id="profit" value="25" type="number"></div><div style="flex:1"><label>TYPE</label><select id="type"><option value="percent">% Persen</option><option value="rupiah">Rp</option></select></div></div>
<select id="target"><option value="MLID">MLID - Indonesia</option><option value="MLMY" selected>MLMY - Malaysia</option></select>
<button class="p" onclick="sync()">🔄 SYNC PRODUK SYNNMLBB</button>
<button class="b" onclick="save()">💾 SIMPAN</button>
<div id="log" class="log">Tekan SYNC</div>
<div id="list" style="margin-top:12px"></div>
</div>
<script>
let all=[];
function log(t){document.getElementById('log').innerText+="\n"+t}
async function sync(){
 const key=document.getElementById('apiKey').value.trim();
 let ep=document.getElementById('endpoint').value.trim();
 if(!ep.includes('api_key')) ep=ep+"?api_key="+key;
 document.getElementById('log').innerText="Fetch: "+ep;
 try{
  const res=await fetch(ep);
  const txt=await res.text();
  log("Status "+res.status+" len "+txt.length);
  let j=JSON.parse(txt);
  // SYNN format boleh jadi {data:[...]} atau {result:[...]} atau array terus
  let prods=[];
  if(Array.isArray(j)) prods=j;
  else if(j.data && Array.isArray(j.data)) prods=j.data;
  else if(j.data && typeof j.data==='object') prods=Object.values(j.data);
  else if(j.products) prods=j.products;
  else if(j.result) prods=j.result;
  else prods=Object.values(j).filter(v=>typeof v==='object');

  log("Raw keys: "+Object.keys(j).slice(0,5));
  if(prods.length>0) log("Contoh produk pertama: "+JSON.stringify(prods[0]).slice(0,200));

  all=prods;
  log("✅ Jumpa "+prods.length+" produk");
  render();
 }catch(e){ log("❌ "+e.message); }
}
function render(){
 const list=document.getElementById('list'); list.innerHTML="";
 const profit=parseFloat(document.getElementById('profit').value)||25;
 const type=document.getElementById('type').value;
 all.forEach((p,i)=>{
  // SYNN field mapping - cuba semua kemungkinan
  const name=p.product || p.name || p.product_name || p.title || p.label || ("Produk "+i);
  const rawPrice=p.price || p.cost || p.base_price || p.modal || p.harga || 0;
  const base=parseFloat(String(rawPrice).replace(/[^0-9.]/g,''))||0;
  let sell=base;
  if(type==='percent') sell=base + base*profit/100;
  else sell=base + profit;
  const div=document.createElement('div');
  div.className='item';
  div.innerHTML=`<label><input type="checkbox" checked data-i="${i}"> ${name}<br><small style="color:#94a3b8">Modal: ${base}</small></label><span style="color:#22c55e;font-weight:700">RM ${sell.toFixed(2)}</span>`;
  list.appendChild(div);
 });
}
function save(){
 const t=document.getElementById('target').value;
 const cbs=document.querySelectorAll('#list input:checked');
 let out=[]; cbs.forEach(cb=> out.push(all[parseInt(cb.dataset.i)]));
 localStorage.setItem("products_"+t, JSON.stringify(out));
 alert("✅ Simpan "+out.length+" ke "+t+"! Buka mlmy.html cek");
}
</script></body></html>
