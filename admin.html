<script>
let synnProducts=[];
function setStatus(m,t){document.getElementById('status').innerHTML=`<div class="status ${t}">${m}</div>`}
function getLocalKey(){return document.getElementById('localGame').value}
function saveConfig(){localStorage.setItem('SYNNMLBB_KEY',document.getElementById('apiKey').value);localStorage.setItem('SYNNMLBB_PROFIT',document.getElementById('profitSet').value);}

async function syncSynn(){
 let key=document.getElementById('apiKey').value.trim();
 let base=document.getElementById('apiBase').value.trim();
 if(!key) return setStatus('API Key kosong','err');
 setStatus('⏳ Connecting ke synnmlbb.com...','ok');
 saveConfig();
 
 // SynnMLBB format biasanya: ?api_key=KEY atau header X-API-KEY atau Bearer
 let urlsToTry=[
   `${base}?api_key=${key}`,
   `${base}?apikey=${key}`,
   `${base}?key=${key}`,
   base
 ];
 
 let data=null;
 let lastErr='';
 for(let url of urlsToTry){
   try{
     setStatus(`⏳ Coba: ${url.substring(0,60)}...`,'ok');
     let res=await fetch(url,{
       method:'GET',
       headers:{
         'X-API-KEY':key,
         'api-key':key,
         'Authorization':`Bearer ${key}`,
         'Content-Type':'application/json'
       }
     });
     let txt=await res.text();
     try{ data=JSON.parse(txt); }catch(e){ data=null; lastErr=txt.substring(0,200); }
     if(res.ok && data){ break; }
   }catch(e){ lastErr=e.message; }
 }
 
 if(!data){
   setStatus(`❌ Gagal fetch langsung (CORS). Error: ${lastErr}<br><br><b>PAKAI MODE MANUAL:</b> Buka link ini di browser baru:<br><code>${base}?api_key=${key}</code><br>Copy JSON nya paste di bawah`,'err');
   document.getElementById('synnList').innerHTML=`
   <textarea id="manualJson" rows="10" placeholder='Paste JSON dari https://synnmlbb.com/api/v1/products?api_key=KEY disini'></textarea>
   <button class="biru" onclick="parseManual()">PARSE JSON MANUAL</button>
   <div style="margin-top:8px;font-size:10px;color:#7a8599">
   Cara:<br>1. Buka di Chrome: https://synnmlbb.com/api/v1/products?api_key
