<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KHAI STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
:root{--bg:#080c14;--card:#121a2b;--biru:#1a5bff;--text:#fff;--kelabu:#7a8599;--garis:#1a253e}
body{background:var(--bg);color:var(--text)}
.top{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--garis)}
.logo{height:34px;border-radius:8px;background:#fff;padding:2px}
.ikon{width:38px;height:38px;border-radius:12px;border:none;background:var(--card);color:var(--text);border:1px solid var(--garis)}
.drawer{position:fixed;top:54px;right:-100%;width:85%;height:100%;background:var(--card);z-index:200;padding:16px;transition:.35s}
.drawer.buka{right:0}
.cari{display:flex;gap:8px;background:var(--bg);border:1px solid var(--garis);border-radius:12px;padding:12px;margin-bottom:12px}
.cari input{flex:1;background:transparent;border:none;outline:none;color:var(--text)}
.m{padding:14px;background:var(--bg);border-radius:12px;margin-bottom:8px;font-weight:700;font-size:12px;color:var(--kelabu)}
.m.aktif{background:#12295a;color:#3a7bff;border:1px solid #1a4fbf}
.banner{margin:12px;border-radius:18px;height:165px;overflow:hidden;background:var(--card);position:relative}
.track{display:flex;height:100%;transition:.5s}
.track img{width:100%;height:100%;object-fit:cover;flex-shrink:0}
.dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dots span{width:20px;height:6px;background:#fff6;border-radius:10px}
.dots span.on{background:#fff}
.tajuk{padding:16px 14px 10px;font-size:14px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 12px}
.kad{background:var(--card);border:1px solid var(--garis);border-radius:16px;overflow:hidden;aspect-ratio:3/4.2;position:relative;cursor:pointer}
.kad img{width:100%;height:100%;object-fit:cover}
.kad b{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000);padding:10px 6px;font-size:10px;text-align:center;color:#fff}
.tabs{display:flex;gap:8px;padding:10px 14px;overflow:auto}
.tab{padding:8px 18px;border-radius:20px;border:none;background:var(--card);color:var(--kelabu);font-weight:700;white-space:nowrap;border:1px solid var(--garis)}
.tab.aktif{background:var(--biru);color:#fff}
.more{margin:16px auto;display:block;background:var(--biru);color:#fff;border:none;padding:10px 24px;border-radius:20px;font-weight:800}
.bawah{border-top:1px solid var(--garis);padding:18px 14px;margin-top:18px;color:var(--kelabu);font-size:12px}
.wa{position:fixed;bottom:16px;right:14px;width:54px;height:54px;background:#00d084;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="top">
<img id="logoTop" class="logo" src="https://via.placeholder.com/120x40/ffffff/000000?text=KHAI+STORE">
<div style="display:flex;gap:8px"><button class="ikon" id="btnTheme">☀️</button><button class="ikon">👤</button><button class="ikon" id="btnMenu">☰</button></div>
</div>
<div id="drawer" class="drawer">
<div class="cari">🔍 <input id="cari" placeholder="Quick search..."></div>
<div class="m aktif">▦ HOME</div><div class="m">⌕ TRACK ORDER</div><div class="m">🧮 CALCULATOR</div><div class="m">📍 CHECK REGION</div>
</div>
<div class="banner"><div id="track" class="track"></div><div id="dots" class="dots"></div></div>
<div class="tajuk">🔥 FAMOUS GAME MALAYSIA</div>
<div id="grid1" class="grid"></div>
<div class="tajuk">▦ ALL SERVICES</div>
<div class="tabs">
<button class="tab aktif" data-f="semua">Semua</button>
<button class="tab" data-f="uid">UID Games</button>
<button class="tab" data-f="other">Other Region</button>
</div>
<div id="grid2" class="grid"></div>
<button id="btnMore" class="more">Show More</button>
<div class="bawah"><p>© 2026 KHAI STORE. ALL RIGHTS RESERVED.</p></div>
<a class="wa" href="https://wa.me/601115852234">💬</a>
<script>
const LOGO_URL="https://via.placeholder.com/120x40/ffffff/000000?text=KHAI+STORE";
const BANNER_URLS=["https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800","https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=800"];
const GAMES=[
{name:"Mobile Legends MY",t:"uid",img:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300",link:"mlmy.html"},
{name:"Mobile Legends ID",t:"other",img:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300",link:"mlmy.html"},
{name:"Mobile Legends Global",t:"other",img:"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=300",link:"mlmy.html"},
{name:"Free Fire IN",t:"uid",img:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300",link:"mlmy.html"},
{name:"PUBG Mobile",t:"uid",img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300",link:"mlmy.html"},
{name:"Free Fire MY/SG",t:"uid",img:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300",link:"mlmy.html"},
{name:"AFK Journey",t:"other",img:"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300",link:"mlmy.html"},
{name:"Arena Breakout",t:"uid",img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300",link:"mlmy.html"},
{name:"Genshin Impact",t:"other",img:"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=300",link:"mlmy.html"}
];
function render(id,list){document.getElementById(id).innerHTML=list.map(g=>`<div class="kad" onclick="location.href='${g.link}'"><img src="${g.img}"><b>${g.name}</b></div>`).join('')}
document.getElementById('logoTop').src=LOGO_URL;
let track=document.getElementById('track');let dots=document.getElementById('dots');
track.innerHTML=BANNER_URLS.map(u=>`<img src="${u}">`).join('');dots.innerHTML=BANNER_URLS.map((_,i)=>`<span class="${i==0?'on':''}"></span>`).join('');
let idx=0;setInterval(()=>{idx=(idx+1)%BANNER_URLS.length;track.style.transform=`translateX(-${idx*100}%)`;dots.querySelectorAll('span').forEach((s,i)=>s.className=i==idx?'on':'')},3000);
render('grid1',GAMES.slice(0,6));let showAll=false;render('grid2',GAMES.slice(0,6));
document.getElementById('btnMenu').onclick=()=>document.getElementById('drawer').classList.toggle('buka');
document.getElementById('cari').oninput=e=>{let v=e.target.value.toLowerCase();let f=GAMES.filter(x=>x.name.toLowerCase().includes(v));render('grid1',f);render('grid2',f.slice(0,6))};
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('aktif'));t.classList.add('aktif');let fil=t.dataset.f;let list=fil=='semua'?GAMES:GAMES.filter(x=>x.t==fil);render('grid2',showAll?list:list.slice(0,6))}});
document.getElementById('btnMore').onclick=e=>{showAll=!showAll;e.target.innerText=showAll?'Show Less':'Show More';let act=document.querySelector('.tab.aktif').dataset.f;let list=act=='semua'?GAMES:GAMES.filter(x=>x.t==act);render('grid2',showAll?list:list.slice(0,6))};
</script>
</body>
</html>
